'2':`<div class="page"><div class="k">01 / SAME TASK, REAL BILLING</div><div class="title">同一套 Agent 任务，结果并不“相当”</div><div class="deck">16对象 × healthy/broken 两臂。Fable 因 ¥8 上限仅尝试16条。</div><div class="rows"><div class="row head"><div>MODEL</div><div>完成</div><div>正确</div><div>实扣</div></div><div class="row"><div class="name">DeepSeek V4 Pro</div><div class="v">32/32</div><div class="v warn">29/32</div><div class="v good">¥0.57</div></div><div class="row"><div class="name">Claude Opus 4.8</div><div class="v">32/32</div><div class="v good">32/32</div><div class="v">¥9.15</div></div><div class="row"><div class="name">GPT-5.6 Sol</div><div class="v">32/32</div><div class="v good">32/32</div><div class="v">¥3.96</div></div><div class="row"><div class="name">Claude Fable 5</div><div class="v">16/32</div><div class="v bad">12/14*</div><div class="v">¥8.32</div></div></div>${foot}</div>`,

'6':`<div class="page"><div class="k">05 / U-KING IS THE INSTALL LAYER</div><div class="title">国际一流 Agent<br>＋ 国产大模型大脑</div><div class="stack"><div class="tool">Claude Code</div><div class="tool">Codex</div><div class="tool">Hermes</div><div class="tool">OpenClaw</div></div><div class="plus">＋ 一键配置 DeepSeek</div><div class="claim">下载、Node、PATH、网络、API<br><span class="cyan">U-King 帮你装好并验证</span></div><div class="small" style="margin-top:30px;text-align:center">不是再造聊天框。是把真正能干活的 Agent 装进电脑。</div>${foot}</div>`};
