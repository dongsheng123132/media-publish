const C = {"slug":"workspace-move-top","title":"工作区移到最上面 · 单独推广","subtitle":"一个只做一件事的 DSH 插件：一次点击到顶，不置顶、不自动重排。","primaryUrl":"https://dongsheng123132.github.io/media-publish/move-top/","langs":["zh","en"],"defaultLang":"zh","repos":[{"label":"npm","url":"https://www.npmjs.com/package/dsh-plugin-workspace-move-top"},{"label":"GitHub","url":"https://github.com/dongsheng123132/workspace-hub/tree/main/plugins/dsh-workspace-move-top"}],"platforms":[{"id":"note-order","kind":"note","name":"发布前的四道门（别跳）","region":"cn","priority":3,"how":"顺序错了，后面全是白工","fields":[{"label":"① npm 真的是 0.2.2 吗","value":"npm view dsh-plugin-workspace-move-top dist-tags.latest  →  必须等于 0.2.2（staged 占位不算）","rows":2},{"label":"② README 第一段","value":"必须是定义句 + 安装命令 + 一句「不做什么」。引擎和人都只看这一段。","rows":3},{"label":"③ 仓库元数据","value":"repo description 写一句人话；topics 加 dsh / dsh-plugin / workspace / ordering；npm keywords 已有。","rows":3},{"label":"④ 页面能开","value":"https://dongsheng123132.github.io/media-publish/move-top/ 必须 200 且不被登录墙挡。没有页面就先别发 HN——HN 用户点不进去就不会投票。","rows":3}]},{"id":"hn","name":"Hacker News · Show HN","region":"intl","priority":3,"how":"先提交标题+链接 → 立刻把正文贴成第一条评论（提交页没有正文框）","submitUrl":"https://news.ycombinator.com/submitlink?u={url}&t={title}","url":"https://dongsheng123132.github.io/media-publish/move-top/","title":"Show HN: DSH plugin that moves a workspace to the top in one click","text":"Observation first, tool second.\n\nDSH's workspace menu gives you \"move up one\". I keep nineteen workspaces, and the one I want is usually around eleventh. So getting it to the top costs eleven clicks — and the menu item was clearly designed for \"I'm one slot away\", not for \"I want the top\".\n\nI also had the wrong mental model for a week: I thought I wanted pinning. Pinning (where a client ships it) is a separate block that keeps the top forever. What I actually want is \"front today, then drift down as I work\". Those are different products, and the second one is a one-shot write to the natural order.\n\nSo this does exactly one thing: adds \"move to top\" to the workspace menu, writes the order once through the host's own workspaceRegistry.insertBefore, and leaves the rest draggable. No favourites, no pinning, no background re-sort pass, nothing to configure. 17.5 KB unpacked, 11 files, zero runtime dependencies, MIT.\n\nHonest limits, because they matter more than the feature:\n- The host exposes no menu-extension slot for workspaces, so the item is injected into the menu DOM. If a DSH update changes that structure, the item disappears. Documented, not hidden.\n- Node tests can't replace real Electron DOM verification; I re-checked the menu on 0.2.2-rc.1 by hand.\n- It's DSH-only. Nothing here is useful in VS Code or Cursor.\n\nInstall: `dsh plugin --profile desktop add dsh-plugin-workspace-move-top@0.2.2`\nPage: https://dongsheng123132.github.io/media-publish/move-top/\nCode: https://github.com/dongsheng123132/workspace-hub/tree/main/plugins/dsh-workspace-move-top\n\nCurious how others handle sidebar ordering at this size: auto-sort by last-used, a separate pinned block, or free drag? At nineteen workspaces I found auto-sort actively unhelpful — the workspace I want is often one I haven't touched today.","tips":"标题 ≤80 字符；不用大写和感叹号；不要拉票；全程在线回技术问题。iOS/桌面插件在 HN 的唯一卖点是「取舍讲清楚」。","limit":80},{"id":"peerlist","name":"Peerlist Launchpad","region":"intl","priority":3,"how":"周一 UTC 开榜；先完成个人资料验证（工作证明免费）","submitUrl":"https://peerlist.io/launchpad","url":"https://dongsheng123132.github.io/media-publish/move-top/","title":"Move a workspace to the top of the DSH sidebar, once","text":"`dsh-plugin-workspace-move-top` is a DeepSeek Harness (DSH) plugin that adds a \"move to top\" item to the workspace menu: one click puts a workspace at the top of the sidebar, and the rest of the order stays draggable. Install: `dsh plugin --profile desktop add dsh-plugin-workspace-move-top@0.2.2`.\n\nWhy this exists: the menu only ships \"move up one\". At 19 workspaces that's 11 clicks today and 11 again tomorrow.\n\nWhy not pinning: pinning is a separate block that keeps the top forever. Most days I only want \"front today\".\n\nLimits: DOM-injected menu item (host has no menu slot), DSH-only, tested on 0.2.1-rc.5 / 0.2.2-rc.1.\n\nhttps://dongsheng123132.github.io/media-publish/move-top/","tips":"排名 = upvote + 评论 + 浏览 + 链接点击 + 牵引力；周一周二随机排序；只有「有内容的评论」计入。求票 = spam。","fields":[{"label":"项目名","value":"Workspace Move Top"},{"label":"一句话","value":"One click to move a DSH workspace to the top of the sidebar."},{"label":"Demo 链接","value":"https://dongsheng123132.github.io/media-publish/move-top/"}]},{"id":"devhunt","name":"DevHunt","region":"intl","priority":3,"how":"GitHub 登录 → 账户页提交 → 免费先挂永久页（$49 才有 dofollow）","submitUrl":"https://devhunt.org/","url":"https://dongsheng123132.github.io/media-publish/move-top/","title":"dsh-plugin-workspace-move-top","text":"`dsh-plugin-workspace-move-top` is a DeepSeek Harness (DSH) plugin that adds a \"move to top\" item to the workspace menu: one click puts a workspace at the top of the sidebar, and the rest of the order stays draggable. Install: `dsh plugin --profile desktop add dsh-plugin-workspace-move-top@0.2.2`.\n\nFacts (verified 2026-11-17)\n- version 0.2.2 · 17,550 bytes unpacked · 11 files · no runtime dependencies · MIT\n- peer: @deepseek-ai/dsh-workspace >=0.2.1-rc.5 <0.3.0 (tested on 0.2.2-rc.1 and 0.2.1-rc.5)\n- it writes the host's persistent order once via workspaceRegistry.insertBefore; the plugin stores no ordering or favourite state\n- it does not: pin, favourite, re-sort in the background, or touch other apps' state\n- known limit: the host exposes no workspace-menu extension slot, so the item is injected into the menu DOM; a host menu change can hide it\n\nRepo: https://github.com/dongsheng123132/workspace-hub/tree/main/plugins/dsh-workspace-move-top","tips":"只收开发者工具；免费档 nofollow 但永久可见。想 dofollow 再买 $49 的某一个周。"},{"id":"producthunt","name":"Product Hunt","region":"intl","priority":2,"how":"个人号满 7 天才能发；12:01 AM 太平洋时间开榜","submitUrl":"https://www.producthunt.com/posts/new","url":"https://dongsheng123132.github.io/media-publish/move-top/","title":"Move a workspace to the top in one click (DSH plugin)","text":"`dsh-plugin-workspace-move-top` is a DeepSeek Harness (DSH) plugin that adds a \"move to top\" item to the workspace menu: one click puts a workspace at the top of the sidebar, and the rest of the order stays draggable. Install: `dsh plugin --profile desktop add dsh-plugin-workspace-move-top@0.2.2`.\n\nOne feature, honestly scoped: no pinning, no auto-sort, 17.5 KB, zero dependencies.\n\nhttps://dongsheng123132.github.io/media-publish/move-top/","tips":"tagline ≤60；描述 ≤500；不要直接求 upvote（2026 算法惩罚），换成求反馈。"},{"id":"lobsters","name":"Lobsters","region":"intl","priority":2,"how":"链接帖，标题别营销腔","submitUrl":"https://lobste.rs/stories/new","url":"https://dongsheng123132.github.io/media-publish/move-top/","title":"A DSH plugin that moves a workspace to the top, once","tags":["programming"],"tips":"Lobsters 对标题语气比 HN 还敏感；先把「为什么不做置顶」写在第一段。"},{"id":"devto","name":"Dev.to","region":"intl","priority":2,"how":"改成一篇短文再发（不是贴广告）","submitUrl":"https://dev.to/new","url":"https://dongsheng123132.github.io/media-publish/move-top/","title":"Move up one vs move to top: a sidebar-ordering design note","text":"Every workspace sidebar ships \"move up one\". Almost none ship \"move to top\".\n\nAt 19 workspaces, \"move up one\" is a keyboard fallback for dragging — it assumes you are one slot away. You are not; you want the top.\n\nI shipped a 17.5 KB DSH plugin that does the one-shot write (through the host's own order API) and nothing else: no favourites, no pinning, no background re-sort.\n\n`dsh-plugin-workspace-move-top` is a DeepSeek Harness (DSH) plugin that adds a \"move to top\" item to the workspace menu: one click puts a workspace at the top of the sidebar, and the rest of the order stays draggable. Install: `dsh plugin --profile desktop add dsh-plugin-workspace-move-top@0.2.2`.\n\nKnown limit: the host has no menu-extension slot, so the item is DOM-injected.\n\nhttps://dongsheng123132.github.io/media-publish/move-top/","tips":"Dev.to 发「设计笔记」比发「我的产品」更容易被推；末尾放链接即可。","limit":128},{"id":"x","name":"X / Twitter","region":"intl","priority":2,"how":"一条推 + 一张动图（页面的演示区块录屏 3 秒）","submitUrl":"https://twitter.com/intent/tweet?text={text}","url":"https://dongsheng123132.github.io/media-publish/move-top/","text":"DSH 的工作区菜单只有「上移一格」。19 个工作区，想要的在第 11 位 —— 今天按 11 次，明天再按 11 次。\n\n写了个 17.5 KB 的插件：点一次到顶，之后照旧可拖。不置顶、不自动重排、零依赖。\n\nhttps://dongsheng123132.github.io/media-publish/move-top/","limit":280,"textLimit":280},{"id":"indiehackers","name":"Indie Hackers","region":"intl","priority":1,"how":"产品页 + 一篇「为什么只做这一个功能」","submitUrl":"https://www.indiehackers.com/products","url":"https://dongsheng123132.github.io/media-publish/move-top/","title":"One feature, 17 KB, zero dependencies: why I resisted scope creep","text":"I could have built pinning, favourites, tags and auto-sort into this. I built one menu item instead.\n\n`dsh-plugin-workspace-move-top` is a DeepSeek Harness (DSH) plugin that adds a \"move to top\" item to the workspace menu: one click puts a workspace at the top of the sidebar, and the rest of the order stays draggable. Install: `dsh plugin --profile desktop add dsh-plugin-workspace-move-top@0.2.2`.\n\nReads: founders, not DSH users. The value here is the scope decision, not the install.","tips":"读者是创始人；写取舍，不写功能清单。"},{"id":"v2ex","name":"V2EX · 分享创造","region":"cn","priority":3,"how":"发到 /go/create，标题带「分享」，正文讲清解决什么","submitUrl":"https://www.v2ex.com/new","url":"https://dongsheng123132.github.io/media-publish/move-top/","title":"分享一个 DSH 插件：把工作区一次性移到最上面","text":"「工作区移到最上面」（dsh-plugin-workspace-move-top）是一个 DeepSeek Harness（DSH）桌面端插件：在工作区菜单里加一项「移到最上面」，把某个工作区一次性提到侧栏第一位，之后仍可自由拖动。安装：`dsh plugin --profile desktop add dsh-plugin-workspace-move-top@0.2.2`。\n\n为什么做：官方菜单只有「上移一格」，19 个工作区时今天按 11 次、明天再按 11 次。\n\n为什么不做成置顶：置顶是另一条固定列表，会一直占着最上面；多数时候我只要「今天在最前」。\n\n诚实边界：宿主没给工作区菜单留扩展位，这一项是注入 DOM 的，宿主改菜单结构后可能不出现；只支持 DSH 0.2.x。\n\nhttps://dongsheng123132.github.io/media-publish/move-top/","tips":"V2EX 只认「自己做的 + 讲清楚」；别发广告腔，别在标题里堆关键词。","limit":120},{"id":"juejin","name":"掘金","region":"cn","priority":2,"how":"写成一篇短的技术笔记，不是产品页","submitUrl":"https://juejin.cn/editor/drafts/new","url":"https://dongsheng123132.github.io/media-publish/move-top/","title":"给 DSH 写了个 17KB 的插件：为什么「移到最上面」比「置顶」难做","text":"「工作区移到最上面」（dsh-plugin-workspace-move-top）是一个 DeepSeek Harness（DSH）桌面端插件：在工作区菜单里加一项「移到最上面」，把某个工作区一次性提到侧栏第一位，之后仍可自由拖动。安装：`dsh plugin --profile desktop add dsh-plugin-workspace-move-top@0.2.2`。\n\n技术点：菜单没有扩展 slot，只能注入；顺序必须走宿主的 workspaceRegistry.insertBefore 才能重启不丢；插件自己不能存排序状态，否则会和宿主打架。\n\nhttps://dongsheng123132.github.io/media-publish/move-top/","tips":"掘金要分类/标签/192×128 封面/≤100 字摘要，见 references/submit-fields-and-covers.md。","limit":100},{"id":"zhihu","name":"知乎专栏","region":"cn","priority":2,"how":"问句式标题，正文先讲现象再讲工具","submitUrl":"https://zhuanlan.zhihu.com/write","url":"https://dongsheng123132.github.io/media-publish/move-top/","title":"为什么几乎所有工作区侧栏都只有「上移一格」？","text":"「工作区移到最上面」（dsh-plugin-workspace-move-top）是一个 DeepSeek Harness（DSH）桌面端插件：在工作区菜单里加一项「移到最上面」，把某个工作区一次性提到侧栏第一位，之后仍可自由拖动。安装：`dsh plugin --profile desktop add dsh-plugin-workspace-move-top@0.2.2`。\n\n「上移一格」原本是拖拽的键盘替代品，它假设你只差一格。可实际场景是：我要的那个在第一屏外面。\n\nhttps://dongsheng123132.github.io/media-publish/move-top/","tips":"知乎的流量来自问句标题 + 长文；末尾放 GitHub 与 npm。","limit":100},{"id":"jike","name":"即刻","region":"cn","priority":1,"how":"一条动态 + 一张演示截图","submitUrl":"https://web.okjike.com/","url":"https://dongsheng123132.github.io/media-publish/move-top/","text":"「工作区移到最上面」（dsh-plugin-workspace-move-top）是一个 DeepSeek Harness（DSH）桌面端插件：在工作区菜单里加一项「移到最上面」，把某个工作区一次性提到侧栏第一位，之后仍可自由拖动。安装：`dsh plugin --profile desktop add dsh-plugin-workspace-move-top@0.2.2`。\n\n只做一件事的插件，17.5 KB，零依赖。https://dongsheng123132.github.io/media-publish/move-top/","tips":"即刻是 maker 浓度最高的中文社区之一，短句 + 截图最有效。"}]};

const LNAME={zh:'中文',en:'English',ja:'日本語',es:'Español',ko:'한국어',de:'Deutsch',fr:'Français',pt:'Português'};
const LANG={
 zh:{brand:'宣发发布台',prog:'进度',bar:'点「一键打开」在当前浏览器开发布页（用你有各平台登录态的浏览器打开本文件）· 勾选「已发」记录到本地',open:'↗ 一键打开发布页',copy:'复制',copied:'已复制 ✓',useImg:'🖼 用主图',done:'已发',foot:'由 media-publish 生成 · 关闭源软件也能发 · 不替你点「提交」，最后一步永远你自己按',masterTitle:'🖼 通配主图（一张图配所有平台 · 需配图的卡都用它）',openBig:'打开大图（右键另存/拖去发布）',copyPrompt:'复制生图提示词',promptLabel:'🎨 生图提示词（gpt-image-2.6-1k · ',promptEnd:'）',needImg:'🖼 需配图 · 用顶部「通配主图」',masterPh:'主图未生成<br>跑 gen-images.mjs 自动出图',fTitle:'标题',fText:'正文',cn:'国内',intl:'海外',preview:'👁 预览',pvNow:'刚刚',pvPro:'工厂直供 · 批发',pvChars:'字符'},
 en:{brand:'Launch Board',prog:'Progress',bar:'Click “Open” to launch each submit page in THIS browser (open this file in the browser where you are logged in) · check “Posted” to track locally',open:'↗ Open submit page',copy:'Copy ',copied:'Copied ✓',useImg:'🖼 Use master image',done:'Posted',foot:'Generated by media-publish · post without installing the source app · never clicks “submit” for you',masterTitle:'🖼 Master image (one image for every platform)',openBig:'Open full image (right-click save / drag to post)',copyPrompt:'Copy image prompt',promptLabel:'🎨 Image prompt (gpt-image-2.6-1k · ',promptEnd:')',needImg:'🖼 Needs an image · use the master image above',masterPh:'Not generated yet<br>run gen-images.mjs',fTitle:'Title',fText:'Body',cn:'CN',intl:'Global',preview:'👁 Preview',pvNow:'now',pvPro:'Factory-direct · Wholesale',pvChars:'chars'},
 ja:{brand:'配信ボード',prog:'進捗',bar:'「開く」で各投稿ページをこのブラウザで開きます（ログイン済みのブラウザでこのファイルを開いてください）· 「投稿済み」にチェックでローカル記録',open:'↗ 投稿ページを開く',copy:'コピー',copied:'コピーしました ✓',useImg:'🖼 メイン画像を使う',done:'投稿済み',foot:'media-publish で生成 · アプリ未インストールでも投稿可 · 「送信」は自分で押します',masterTitle:'🖼 メイン画像（全プラットフォーム共通）',openBig:'原寸で開く（右クリック保存 / ドラッグして投稿）',copyPrompt:'画像プロンプトをコピー',promptLabel:'🎨 画像プロンプト（gpt-image-2.6-1k · ',promptEnd:'）',needImg:'🖼 画像が必要 · 上のメイン画像を使用',masterPh:'未生成<br>gen-images.mjs を実行',fTitle:'タイトル',fText:'本文',cn:'国内',intl:'海外',preview:'👁 プレビュー',pvNow:'たった今',pvPro:'工場直販 · 卸売',pvChars:'文字'},
 es:{brand:'Panel de lanzamiento',prog:'Progreso',bar:'Haz clic en «Abrir» para abrir cada página de publicación en ESTE navegador (abre este archivo en el navegador donde tienes la sesión iniciada) · marca «Publicado» para guardar localmente',open:'↗ Abrir página',copy:'Copiar ',copied:'Copiado ✓',useImg:'🖼 Usar imagen principal',done:'Publicado',foot:'Generado por media-publish · publica sin instalar la app · nunca pulsa «enviar» por ti',masterTitle:'🖼 Imagen principal (una imagen para todas las plataformas)',openBig:'Abrir imagen completa (clic derecho para guardar / arrastrar)',copyPrompt:'Copiar prompt de imagen',promptLabel:'🎨 Prompt de imagen (gpt-image-2.6-1k · ',promptEnd:')',needImg:'🖼 Necesita imagen · usa la imagen principal de arriba',masterPh:'Aún no generada<br>ejecuta gen-images.mjs',fTitle:'Título',fText:'Texto',cn:'CN',intl:'Global',preview:'👁 Vista previa',pvNow:'ahora',pvPro:'Fábrica · Mayorista',pvChars:'caracteres'}
};
const langs=(C.langs&&C.langs.length)?C.langs:['zh','en'];
let lang=localStorage.getItem('mp-lang');
if(!langs.includes(lang)) lang=langs[0];
const L=LANG[lang]||LANG[langs[0]]||LANG.en;
const DEFLANG=C.defaultLang||langs[0];
// T(v)：把「字符串 | 语言对象」解析成当前语言的字符串（多级回退）
function T(v){
  if(v==null) return '';
  if(typeof v!=='object'||Array.isArray(v)) return String(v);
  if(v[lang]!=null) return v[lang];
  if(v[DEFLANG]!=null) return v[DEFLANG];
  for(const g of langs){ if(v[g]!=null) return v[g]; }
  for(const k in v){ if(v[k]!=null) return v[k]; }
  return '';
}
document.documentElement.lang=({zh:'zh-CN',en:'en',ja:'ja',es:'es'}[lang])||lang;
document.title=L.brand+' · '+(T(C.title)||'');
$('#brand').textContent=L.brand;
$('#foot').textContent=L.foot;
const sel=$('#lang');
sel.innerHTML=langs.map(g=>'<option value="'+g+'"'+(g===lang?' selected':'')+'>'+esc(LNAME[g]||g)+'</option>').join('');
sel.onchange=()=>{localStorage.setItem('mp-lang',sel.value);location.reload();};
$('#bar').innerHTML=L.prog+' <b id="cnt">0</b> / <span id="tot">'+((C.platforms||[]).length)+'</span> · '+L.bar;
$('#t').textContent=T(C.title)||'';
$('#sub').textContent=T(C.subtitle)||'';
(C.repos||[]).forEach(r=>{const a=document.createElement('a');a.href=T(r.url);a.target='_blank';a.textContent='↗ '+T(r.label);$('#repos').appendChild(a);});
if(C.masterImage){
  const m=C.masterImage;
  $('#master').innerHTML='<div class="mwrap">'+
    (m.image?'<img src="'+esc(m.image)+'" alt="master">':'<div class="mph">'+L.masterPh+'</div>')+
    '<div class="mbody"><h3>'+L.masterTitle+'</h3>'+
    '<div class="row" style="margin-bottom:8px">'+
      (m.image?'<button class="openimg" id="mopen">'+L.openBig+'</button>':'')+
      '<button class="copy imgbtn" id="mprompt">'+L.copyPrompt+'</button></div>'+
    '<div class="field"><label>'+L.promptLabel+esc(m.size||'1024x1024')+L.promptEnd+'</label><textarea rows="3" id="mpt"></textarea></div></div></div>';
  $('#mpt').value=T(m.prompt)||'';
  if(m.image) $('#mopen').onclick=()=>window.open(m.image,'_blank');
  $('#mprompt').onclick=()=>copy(T(m.prompt)||'');
}
const KEY='mp-done-'+(C.slug||'x');
const done=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'));
function save(){localStorage.setItem(KEY,JSON.stringify([...done]));const c=$('#cnt');if(c)c.textContent=done.size;}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1300);}
function fill(tpl,p){return (tpl||'').replace(/{url}/g,encodeURIComponent(p.url||C.primaryUrl||'')).replace(/{rawurl}/g,p.url||C.primaryUrl||'').replace(/{title}/g,encodeURIComponent(p.title||'')).replace(/{text}/g,encodeURIComponent(p.text||''));}
function copy(txt){navigator.clipboard.writeText(txt).then(()=>toast(L.copied),()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(L.copied);});}
function cjkLen(s){let n=0;for(const ch of (s||'')){n+=/[^\x00-\xff]/.test(ch)?2:1;}return n;}
function pvPick(p,fields){
  const by=re=>{const f=fields.find(f=>re.test(f.label));return f?f.val:'';};
  const title=p.title||by(/标题|Title|Tagline|タイトル|Título/)||'';
  const body=p.text||by(/正文|Body|Description|本文|Texto|Descripción/)||(fields[0]?fields[0].val:'');
  return {title,body};
}
function preview(p,fields){
  const skin=p.id==='x'?'x':/^reddit/.test(p.id)?'reddit':p.id==='hn'?'hn':p.id==='linkedin'?'linkedin':(p.id==='xiaohongshu'||p.id==='xhs')?'xhs':(p.region==='cn'?'cn':'generic');
  const c=pvPick(p,fields);
  const name=(C.repos&&C.repos[0]&&T(C.repos[0].label))||'You';
  const ini=esc(name.slice(0,1).toUpperCase());
  const host=(((C.primaryUrl||'').replace(/^https?:/,'').split('/').filter(Boolean))[0])||'';
  const showImg=C.masterImage&&C.masterImage.image&&(p.needsImage||skin==='xhs');
  const img=showImg?'<img class="pvimg" src="'+esc(C.masterImage.image)+'" alt="">':'';
  const cut=(s,n)=>{s=s||'';return esc(s.length>n?s.slice(0,n)+'…':s);};
  if(skin==='hn') return '<div class="pv hn"><div style="font-weight:600">'+cut(c.title||c.body,80)+' <span class="hnmeta">('+esc(host.split('/')[0])+')</span></div><div class="hnmeta">▲ 1 point · by you · '+L.pvNow+' · 0 comments</div></div>';
  if(skin==='reddit') return '<div class="pv reddit"><div class="pvsub">'+esc(p.previewSub||'r/community')+' · '+L.pvNow+'</div><div class="pvtitle">'+esc(c.title)+'</div><div class="pvbody">'+cut(c.body,220)+'</div>'+img+'</div>';
  if(skin==='xhs'){const lines=(c.body||'').split('\n');return '<div class="pv xhs">'+img+'<div class="pvtitle">'+esc(lines[0]||c.title)+'</div><div class="pvbody">'+cut(lines.slice(1).join('\n'),140)+'</div></div>';}
  const isX=skin==='x',isLi=skin==='linkedin';
  const handle=isX?('@'+(C.slug||'you').replace(/[^a-z0-9_]/gi,'').slice(0,15)):(isLi?L.pvPro:host.split('/')[0]);
  const xlim=(pvPick(p,fields).textLimit||280);const charline=isX?'<div class="pvcnt">'+cjkLen(c.body)+'/'+xlim+' '+L.pvChars+'</div>':'';
  return '<div class="pv '+(isX?'x':isLi?'linkedin':'cn')+'">'+
    '<div class="pvhd"><div class="av">'+ini+'</div><div><div class="nm">'+esc(name)+'</div><div class="hnd">'+esc(handle)+'</div></div></div>'+
    (c.title&&!isX?'<div class="pvbody" style="font-weight:700;padding-bottom:0">'+esc(c.title)+'</div>':'')+
    '<div class="pvbody">'+cut(c.body,isX?280:400)+'</div>'+charline+img+
    ((isX||isLi)?'<div class="pvlink">🔗 '+esc(host)+'</div>':'')+'</div>';
}
const grid=$('#grid');
(C.platforms||[]).forEach(p=>{
  // 按当前语言解析这张卡的所有文案（pr = platform resolved）
  const pr=Object.assign({},p,{name:T(p.name),how:T(p.how),title:T(p.title),text:T(p.text),tips:T(p.tips),url:T(p.url)});
  const card=document.createElement('div');card.className='card'+(done.has(p.id)?' done':'');
  const region=p.region==='cn'?'<span class="tag cn">'+L.cn+'</span>':'<span class="tag intl">'+L.intl+'</span>';
  const star=p.priority?'<span class="star">'+'★'.repeat(p.priority)+'</span>':'';
  // 统一成 fields：title/text 是隐式字段，p.fields[] 是额外带标签字段（如 Product Hunt / Amazon 表单）
  const fields=[];
  if(pr.title) fields.push({label:T(p.titleLabel)||L.fTitle,val:pr.title,rows:2,limit:p.limit||0});
  if(pr.text) fields.push({label:T(p.textLabel)||L.fText,val:pr.text,rows:8,limit:p.textLimit||0});
  (p.fields||[]).forEach(f=>fields.push({label:T(f.label),val:T(f.value),rows:f.rows||4,limit:f.limit||0}));
  let h='<div class="top"><span class="name">'+esc(pr.name)+'</span>'+region+star+
    '<label class="chk"><input type="checkbox" '+(done.has(p.id)?'checked':'')+'> '+L.done+'</label></div>';
  if(pr.how) h+='<div class="how">'+esc(pr.how)+'</div>';
  h+='<div class="row"><button class="open">'+L.open+'</button>';
  fields.forEach((f,i)=>{h+='<button class="copy" data-ci="'+i+'">'+L.copy+esc(f.label)+'</button>';});
  if(p.needsImage&&C.masterImage&&C.masterImage.image) h+='<button class="openimg" data-oi="1">'+L.useImg+'</button>';
  h+='<button class="pvbtn">'+L.preview+'</button>';
  h+='</div>';
  fields.forEach((f,i)=>{h+='<div class="field"><label>'+esc(f.label)+(f.limit?' <span class="cnt" data-cnt="'+i+'"></span>/'+f.limit:'')+'</label><textarea rows="'+f.rows+'" data-fi="'+i+'"></textarea></div>';});
  if(p.needsImage) h+='<div class="tips">'+L.needImg+'</div>';
  if(pr.tips) h+='<div class="tips">'+esc(pr.tips)+'</div>';
  h+='<div class="pvbox" style="display:none"></div>';
  card.innerHTML=h;
  fields.forEach((f,i)=>{const ta=card.querySelector('[data-fi="'+i+'"]');ta.value=f.val;if(f.limit){const c=card.querySelector('[data-cnt="'+i+'"]');const upd=()=>{const n=cjkLen(ta.value);c.textContent=n;c.style.color=n>f.limit?'#ff6b6b':'#3fb98a';};upd();ta.oninput=upd;}});
  card.querySelector('.open').onclick=()=>window.open(fill(pr.submitUrl||C.primaryUrl,pr),'_blank');
  const oi=card.querySelector('[data-oi="1"]'); if(oi) oi.onclick=()=>window.open((C.masterImage&&C.masterImage.image)||'#','_blank');
  card.querySelectorAll('.copy').forEach(b=>b.onclick=()=>copy(fields[+b.dataset.ci].val));
  const pvb=card.querySelector('.pvbtn'), pvbox=card.querySelector('.pvbox');
  if(pvb) pvb.onclick=()=>{ if(pvbox.style.display!=='none'&&pvbox.innerHTML){pvbox.style.display='none';return;} fields.forEach((f,i)=>{const ta=card.querySelector('[data-fi="'+i+'"]'); if(ta) f.val=ta.value;}); pvbox.innerHTML=preview(pr,fields); pvbox.style.display='block'; };
  const cb=card.querySelector('.chk input');
  cb.onchange=()=>{cb.checked?done.add(p.id):done.delete(p.id);card.classList.toggle('done',cb.checked);save();};
  grid.appendChild(card);
});
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
save();
</script>
</body>
</html>
