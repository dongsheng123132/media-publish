<script>
const C = {"slug":"opencodex-redline","title":"OpenCodex + Redline 开源发布","subtitle":"绿色 4.7MB 多终端 AI 编程工作台 + 面向 AI 的通用文档标注层，两个都已开源","primaryUrl":"https://github.com/dongsheng123132/opencodex","masterImage":{"prompt":"Square 1:1 social poster, flat vector illustration, dark modern IDE aesthetic, deep navy background with a subtle dot grid, a laptop window split into 4 terminal panes each showing a glowing colored command prompt cursor (multiple AI coding sessions running in parallel), a small friendly cartoon lobster mascot in a corner, accent colors electric blue and mint green, high contrast, clean minimal tech-startup style, no photorealism. Bold top headline “4.7MB · 多终端 AI 编程”, the wordmark “OpenCodex”, and the friendly cartoon lobster mascot. Centered balanced composition that still reads well when cropped to 3:4 or 9:16.","size":"1024x1024","image":"opencodex-redline-images/master.png"},"repos":[{"label":"OpenCodex","url":"https://github.com/dongsheng123132/opencodex"},{"label":"Redline","url":"https://github.com/dongsheng123132/redline"}],"platforms":[{"id":"hn","name":"Hacker News","region":"intl","priority":3,"how":"Show HN：标题+仓库链接，正文放第一条评论。周二~四 美西早 8-10 点最佳","submitUrl":"https://news.ycombinator.com/submitlink?u={url}&t={title}","url":"https://github.com/dongsheng123132/opencodex","title":"Show HN: OpenCodex – a 4.7MB portable multi-terminal workbench for Claude Code","text":"I kept wanting one thing: open a project folder, split the view into several terminals, and run multiple Claude Code / Codex CLIs side by side — without a heavyweight Electron app eating 200MB.\n\nSo I built OpenCodex. It's folder-based: pick a folder, the main area IS a real terminal, split it left/right or top/bottom, run as many AI CLIs as you want. Closing a pane kills the whole child process tree (no orphan node processes). Splitting only repositions panes, so a running claude session never gets killed.\n\nIt's ~4.7MB (Tauri 2 + React, reuses the system WebView — no bundled Chromium). Bring-your-own-model: ships no API keys, talks to no server of its own. Point it at any OpenAI/Anthropic-compatible endpoint (DeepSeek, Zhipu, ollama, Anthropic official, whatever).\n\nRepo: https://github.com/dongsheng123132/opencodex\nMIT. Feedback very welcome — early Demo, I use it daily.\n\nAlso open-sourced its document layer as Redline (Apache-2.0): a host-agnostic annotation layer for AI agents — open any of 11 formats (PDF/Word/Excel/PSD/3D/DXF/…) with no native app, mark it up, and the agent reads the markup to edit the real source file. https://github.com/dongsheng123132/redline","tips":"HN 与 Reddit 别同一天发；前几小时守评论区决定能否上榜。"},{"id":"reddit_claude","name":"Reddit · r/ClaudeAI","region":"intl","priority":3,"submitUrl":"https://www.reddit.com/r/ClaudeAI/submit?title={title}","title":"I made a 4.7MB open-source workbench to run multiple Claude Code sessions in split terminals (per folder)","text":"The official desktop apps and most terminal managers are heavy (Electron, ~200MB) and built around human workflows. I wanted something AI-first and lightweight: open a folder, split into several terminals, run multiple Claude Code / Codex CLIs in parallel.\n\nOpenCodex does exactly that in ~4.7MB (Tauri, reuses the system WebView):\n- main area is a real terminal; split left/right or top/bottom\n- splitting repositions panes — running sessions are never killed\n- closing a pane kills the whole child process tree (no orphans)\n- drag a file/image into the terminal → its path is typed in\n- bring-your-own-model: no bundled keys, no server; any OAI/Anthropic-compatible endpoint\n- layout remembered across restarts, adjustable font, WebGL rendering\n\nMIT, early Demo, I use it daily. Repo: https://github.com/dongsheng123132/opencodex\nWould love feedback on what to add next.\n\nAlso open-sourced its document layer as Redline (Apache-2.0): a host-agnostic annotation layer for AI agents — open any of 11 formats (PDF/Word/Excel/PSD/3D/DXF/…) with no native app, mark it up, and the agent reads the markup to edit the real source file. https://github.com/dongsheng123132/redline","tips":"先看置顶规则；r/ClaudeAI 最对口。"},{"id":"reddit_llama","name":"Reddit · r/LocalLLaMA","region":"intl","priority":2,"submitUrl":"https://www.reddit.com/r/LocalLLaMA/submit?title={title}","title":"A 4.7MB open-source, bring-your-own-model workbench for running multiple AI CLIs in split terminals","text":"The official desktop apps and most terminal managers are heavy (Electron, ~200MB) and built around human workflows. I wanted something AI-first and lightweight: open a folder, split into several terminals, run multiple Claude Code / Codex CLIs in parallel.\n\nOpenCodex does exactly that in ~4.7MB (Tauri, reuses the system WebView):\n- main area is a real terminal; split left/right or top/bottom\n- splitting repositions panes — running sessions are never killed\n- closing a pane kills the whole child process tree (no orphans)\n- drag a file/image into the terminal → its path is typed in\n- bring-your-own-model: no bundled keys, no server; any OAI/Anthropic-compatible endpoint\n- layout remembered across restarts, adjustable font, WebGL rendering\n\nMIT, early Demo, I use it daily. Repo: https://github.com/dongsheng123132/opencodex\nWould love feedback on what to add next.\n\nAlso open-sourced its document layer as Redline (Apache-2.0): a host-agnostic annotation layer for AI agents — open any of 11 formats (PDF/Word/Excel/PSD/3D/DXF/…) with no native app, mark it up, and the agent reads the markup to edit the real source file. https://github.com/dongsheng123132/redline","tips":"强调 BYO-model / 本地 / 任意兼容端点，这个社区吃这套。"},{"id":"ph","name":"Product Hunt","region":"intl","priority":2,"how":"按表单逐格填：Name / Tagline(≤60) / Links / Description(≤500) / Launch tags(≤3) / First comment。发布日选周二/三","submitUrl":"https://www.producthunt.com/posts/new","fields":[{"label":"Name","value":"OpenCodex"},{"label":"Tagline","value":"Run multiple Claude Code sessions in split terminals","limi table multi-terminal workbench for Claude Code","text":"I kept wanting one thing: open a project folder, split the view into several terminals, and run multiple Claude Code / Codex CLIs side by side — without a heavyweight Electron app eating 200MB.\n\nSo I built OpenCodex. It's folder-based: pick a folder, the main area IS a real terminal, split it left/right or top/bottom, run as many AI CLIs as you want. Closing a pane kills the whole child process tree (no orphan node processes). Splitting only repositions panes, so a running claude session never gets killed.\n\nIt's ~4.7MB (Tauri 2 + React, reuses the system WebView — no bundled Chromium). Bring-your-own-model: ships no API keys, talks to no server of its own. Point it at any OpenAI/Anthropic-compatible endpoint (DeepSeek, Zhipu, ollama, Anthropic official, whatever).\n\nRepo: https://github.com/dongsheng123132/opencodex\nMIT. Feedback very welcome — early Demo, I use it daily.\n\nAlso open-sourced its document layer as Redline (Apache-2.0): a host-agnostic annotation layer for AI agents — open any of 11 formats (PDF/Word/Excel/PSD/3D/DXF/…) with no native app, mark it up, and the agent reads the markup to edit the real source file. https://github.com/dongsheng123132/redline","tips":"有邀请码再发；打 tag: ai, tauri。"},{"id":"awesome","name":"awesome-claude-code (PR)","region":"intl","priority":1,"how":"给 awesome 列表提 PR，长尾流量","submitUrl":"https://github.com/hesreallyhim/awesome-claude-code","text":"PR 描述：Add OpenCodex — a 4.7MB portable, bring-your-own-model desktop workbench to run multiple Claude Code sessions in split terminals per folder. https://github.com/dongsheng123132/opencodex","tips":"照该仓库 CONTRIBUTING 的格式加一行。"},{"id":"v2ex","name":"V2EX · 分享创造","region":"cn","priority":3,"how":"选「分享创造」节点","submitUrl":"https://www.v2ex.com/new","title":"做了个 4.7MB 的绿色工具 OpenCodex：一个文件夹开多个终端，分屏跑 Claude Code","text":"一直想要这么个东西：打开一个项目文件夹，把界面分屏成几个终端，同时跑多个 Claude Code / Codex，互不打扰。但现成的桌面工具大多是 Electron，动辄 200MB，而且是面向\"人\"的操作逻辑，不是面向 AI 多终端协同的。\n\n于是做了 OpenCodex，只有 ~4.7MB（Tauri，复用系统 WebView，不打包浏览器内核）：\n- 以文件夹为基础，主区直接是终端，左右/上下随手分屏\n- 分屏只是挪位置，正在跑的 claude 终端永远不会被杀\n- 关终端连子进程树一起清，不留孤儿 node 进程\n- 拖文件/图片/文件夹进终端 → 真实路径自动填进命令行\n- 自带模型：不内置任何 Key、不连任何服务器，填你自己的端点（DeepSeek / 智谱 / Kimi / ollama / Anthropic 官方都行）\n- 布局关 App 重开自动恢复、字号可调、WebGL 渲染高频刷新顺滑\n\n开源 MIT，目前是 Demo 版，我自己天天在用。仓库：https://github.com/dongsheng123132/opencodex\n欢迎提 issue 说说还想要啥功能。\n\n顺手把它的文档标注层也开源了 —— Redline（Apache-2.0）：面向 AI agent 的通用文档标注层，不装 Office/CAD/PS 就能打开 11 种格式，人圈选画箭头写批注，AI 据此去改源文件，Redline 自己从不写回源文件。https://github.com/dongsheng123132/redline","tips":"⭐ 程序员聚集最对口；标题别标题党。"},{"id":"sspai","name":"少数派","region":"cn","priority":2,"how":"投稿，适合「绿色轻量工具」叙事","submitUrl":"https://sspai.com/write","title":"OpenCodex：4.7MB 的绿色多终端 AI 编程工作台","text":"一直想要这么个东西：打开一个项目文件夹，把界面分屏成几个终端，同时跑多个 Claude Code / Codex，互不打扰。但现成的桌面工具大多是 Electron，动辄 200MB，而且是面向\"人\"的操作逻辑，不是面向 AI 多终端协同的。\n\n于是做了 OpenCodex，只有 ~4.7MB（Tauri，复用系统 WebView，不打包浏览器内核）：\n- 以文件夹为基础，主区直接是终端，左右/上下随手分屏\n- 分屏只是挪位置，正在跑的 claude 终端永远不会被杀\n- 关终端连子进程树一起清，不留孤儿 node 进程\n- 拖文件/图片/文件夹进终端 → 真实路径自动填进命令行\n- 自带模型：不内置任何 Key、不连任何服务器，填你自己的端点（DeepSeek / 智谱 / Kimi / ollama / Anthropic 官方都行）\n- 布局关 App 重开自动恢复、字号可调、WebGL 渲染高频刷新顺滑\n\n开源 MIT，目前是 Demo 版，我自己天天在用。仓库：https://github.com/dongsheng123132/opencodex\n欢迎提 issue 说说还想要啥功能。\n\n顺手把它的文档标注层也开源了 —— Redline（Apache-2.0）：面向 AI agent 的通用文档标注层，不装 Office/CAD/PS 就能打开 11 种格式，人圈选画箭头写批注，AI 据此去改源文件，Redline 自己从不写回源文件。https://github.com/dongsheng123132/redline","tips":"配图讲「轻」和「多开」两个点。"},{"id":"juejin","name":"掘金","region":"cn","priority":2,"how":"写一篇「为什么做 OpenCodex」","submitUrl":"https://juejin.cn/editor/drafts/new","title":"为什么我做了个 4.7MB 的 OpenCodex：面向 AI 的多终端编程工厂","text":"一直想要这么个东西：打开一个项目文件夹，把界面分屏成几个终端，同时跑多个 Claude Code / Codex，互不打扰。但现成的桌面工具大多是 Electron，动辄 200MB，而且是面向\"人\"的操作逻辑，不是面向 AI 多终端协同的。\n\n于是做了 OpenCodex，只有 ~4.7MB（Tauri，复用系统 WebView，不打包浏览器内核）：\n- 以文件夹为基础，主区直接是终端，左右/上下随手分屏\n- 分屏只是挪位置，正在跑的 claude 终端永远不会被杀\n- 关终端连子进程树一起清，不留孤儿 node 进程\n- 拖文件/图片/文件夹进终端 → 真实路径自动填进命令行\n- 自带模型：不内置 const KEY='mp-done-'+(C.slug||'x');
const done=new Set(JSON.parse(localStorage.getItem(KEY)||'[]'));
function save(){localStorage.setItem(KEY,JSON.stringify([...done]));$('#cnt').textContent=done.size;}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1300);}
function fill(tpl,p){return (tpl||'').replace(/{url}/g,encodeURIComponent(p.url||C.primaryUrl||'')).replace(/{rawurl}/g,p.url||C.primaryUrl||'').replace(/{title}/g,encodeURIComponent(p.title||'')).replace(/{text}/g,encodeURIComponent(p.text||''));}
function copy(txt){navigator.clipboard.writeText(txt).then(()=>toast('已复制 ✓'),()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('已复制 ✓');});}
function cjkLen(s){let n=0;for(const ch of (s||'')){n+=/[^\x00-\xff]/.test(ch)?2:1;}return n;}
function pvPick(p,fields){
  const by=re=>{const f=fields.find(f=>re.test(f.label));return f?f.val:'';};
  const title=p.title||by(/标题|Title|Tagline/)||'';
  const body=p.text||by(/正文|Body|Description/)||(fields[0]?fields[0].val:'');
  return {title,body};
}
function preview(p,fields){
  const skin=p.id==='x'?'x':/^reddit/.test(p.id)?'reddit':p.id==='hn'?'hn':p.id==='linkedin'?'linkedin':p.id==='xiaohongshu'?'xhs':(p.region==='cn'?'cn':'generic');
  const c=pvPick(p,fields);
  const name=(C.repos&&C.repos[0]&&C.repos[0].label)||'You';
  const ini=esc(name.slice(0,1).toUpperCase());
  const host=(((C.primaryUrl||'').replace(/^https?:/,'').split('/').filter(Boolean))[0])||'';
  const showImg=C.masterImage&&C.masterImage.image&&(p.needsImage||skin==='xhs');
  const img=showImg?'<img class="pvimg" src="'+esc(C.masterImage.image)+'" alt="">':'';
  const cut=(s,n)=>{s=s||'';return esc(s.length>n?s.slice(0,n)+'…':s);};
  if(skin==='hn') return '<div class="pv hn"><div style="font-weight:600">'+cut(c.title||c.body,80)+' <span class="hnmeta">('+esc(host.split('/')[0])+')</span></div><div class="hnmeta">▲ 1 point · by you · '+L.pvNow+' · 0 comments</div></div>';
  if(skin==='reddit') return '<div class="pv reddit"><div class="pvsub">r/ClaudeAI · '+L.pvNow+'</div><div class="pvtitle">'+esc(c.title)+'</div><div class="pvbody">'+cut(c.body,220)+'</div>'+img+'</div>';
  if(skin==='xhs'){const lines=(c.body||'').split('\n');return '<div class="pv xhs">'+img+'<div class="pvtitle">'+esc(lines[0]||c.title)+'</div><div class="pvbody">'+cut(lines.slice(1).join('\n'),140)+'</div></div>';}
  const isX=skin==='x',isLi=skin==='linkedin';
  const handle=isX?('@'+(C.slug||'you').replace(/[^a-z0-9_]/gi,'').slice(0,15)):(isLi?L.pvPro:host.split('/')[0]);
  const charline=isX?'<div class="pvcnt">'+cjkLen(c.body)+'/280 '+L.pvChars+'</div>':'';
  return '<div class="pv '+(isX?'x':isLi?'linkedin':'cn')+'">'+
    '<div class="pvhd"><div class="av">'+ini+'</div><div><div class="nm">'+esc(name)+'</div><div class="hnd">'+esc(handle)+'</div></div></div>'+
    (c.title&&!isX?'<div class="pvbody" style="font-weight:700;padding-bottom:0">'+esc(c.title)+'</div>':'')+
    '<div class="pvbody">'+cut(c.body,isX?280:400)+'</div>'+charline+img+
    ((isX||isLi)?'<div class="pvlink">🔗 '+esc(host)+'</div>':'')+'</div>';
}
const grid=$('#grid');
(C.platforms||[]).forEach(p=>{
  const card=document.createElement('div');card.className='card'+(done.has(p.id)?' done':'');
  const region=p.region==='cn'?'<span class="tag cn">'+L.cn+'</span>':'<span class="tag intl">'+L.intl+'</span>';
  const star=p.priority?'<span class="star">'+'★'.repeat(p.priority)+'</span>':'';
  // 统一成 fields：title/text 是隐式字段，p.fields[] 是额外带标签字段（如 Product Hunt 表单）
  const fields=[];
  if(p.title) fields.push({label:p.titleLabel||L.fTitle,val:p.title,rows:2,limit:p.limit||0});
  if(p.text) fields.push({label:p.textLabel||L.fText,val:p.text,rows:8,limit:0});
  (p.fields||[]).forEach(f=>fields.push({label:f.label,val:f.value,rows:f.rows||4,limit:f.limit||0}));
  let h='<div class="top"><span class="name">'+esc(p.name)+'</span>'+region+star+
    '<label class="chk"><input type="checkbox" '+(done.has(p.id)?'checked':'')+'> '+L.done+'</label></div>';
  if(p.how) h+='<div class="how">'+esc(p.how)+'</div>';
  h+='<div class="row"><button class="open">'+L.open+'</button>';
  fields.forEach((f,i)=>{h+='<button class="copy" data-ci="'+i+'">'+L.copy+esc(f.label)+'</button>';});
  if(p.needsImage&&C.masterImage&&C.masterImage.image) h+='<button class="openimg" data-oi="1">'+L.useImg+'</button>';
  h+='<button class="pvbtn">'+L.preview+'</button>';
  h+='</div>';
  fields.forEach((f,i)=>{h+='<div class="field"><label>'+esc(f.label)+(f.limit?' <span class="cnt" data-cnt="'+i+'"></span>/'+f.limit:'')+'</label><textarea rows="'+f.rows+'" data-fi="'+i+'"></textarea></div>';});
  if(p.needsImage) h+='<div class="tips">'+L.needImg+'</div>';
  if(p.tips) h+='<div class="tips">'+esc(p.tips)+'</div>';
  h+='<div class="pvbox" style="display:none"></div>';
  card.innerHTML=h;
  fields.forEach((f,i)=>{const ta=card.querySelector('[data-fi="'+i+'"]');ta.value=f.val;if(f.limit){const c=card.querySelector('[data-cnt="'+i+'"]');const upd=()=>{const n=cjkLen(ta.value);c.textContent=n;c.style.color=n>f.limit?'#ff6b6b':'#3fb98a';};upd();ta.oninput=upd;}});
  card.querySelector('.open').onclick=()=>window.open(fill(p.submitUrl||C.primaryUrl,p),'_blank');
  const oi=card.querySelector('[data-oi="1"]'); if(oi) oi.onclick=()=>window.open((C.masterImage&&C.masterImage.image)||'#','_blank');
  card.querySelectorAll('.copy').forEach(b=>b.onclick=()=>copy(fields[+b.dataset.ci].val));
  const pvb=card.querySelector('.pvbtn'), pvbox=card.querySelector('.pvbox');
  if(pvb) pvb.onclick=()=>{ if(pvbox.style.display!=='none'&&pvbox.innerHTML){pvbox.style.display='none';return;} fields.forEach((f,i)=>{const ta=card.querySelector('[data-fi="'+i+'"]'); if(ta) f.val=ta.value;}); pvbox.innerHTML=preview(p,fields); pvbox.style.display='block'; };
  const cb=card.querySelector('.chk input');
  cb.onchange=()=>{cb.checked?done.add(p.id):done.delete(p.id);card.classList.toggle('done',cb.checked);save();};
  grid.appendChild(card);
});
function esc(s){return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
save();
</script>
</body>
</html>
